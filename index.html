<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prison Break - Dog Gesture Adventure</title>
    <link rel="stylesheet" href="style.css">
    <!-- TensorFlow.js and BodyPix for background removal -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-segmentation@1.0.2"></script>
    <!-- MediaPipe for hand detection -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1620248257/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🐕 Dog Gesture Adventure</h1>
            <p class="subtitle">An interactive gesture game</p>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
        </div>

        <div class="controls-info">
            <div class="control-item">
                <span class="key">Arrow Keys / WASD</span>
                <span class="action">Move Dog</span>
            </div>
            <div class="control-item">
                <span class="key">Click Canvas</span>
                <span class="action">Change Background</span>
            </div>
            <div class="control-item">
                <span class="key">Hand Gesture</span>
                <span class="action">Shake Screen</span>
            </div>
        </div>

        <div class="status">
            <p id="statusText">Loading game assets...</p>
        </div>
    </div>

    <!-- Hidden elements for video processing -->
    <video id="dogVideo" style="display: none;" loop muted playsinline></video>
    <canvas id="videoCanvas" style="display: none;" width="320" height="240"></canvas>
    <video id="webcam" style="display: none;" autoplay playsinline></video>
    <canvas id="handCanvas" style="display: none;" width="640" height="480"></canvas>

    <script src="game.js"></script>
</body>
</html>
