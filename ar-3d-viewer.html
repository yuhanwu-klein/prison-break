<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D AR Dog Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: white;
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
            pointer-events: none;
        }

        .overlay h1 {
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .overlay p {
            opacity: 0.8;
        }

        .controls-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            pointer-events: all;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        button.active {
            background: rgba(102, 126, 234, 0.8);
        }

        .info-panel {
            position: absolute;
            top: 100px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            max-width: 300px;
            pointer-events: all;
        }

        .info-panel h3 {
            margin-bottom: 15px;
            color: #667eea;
        }

        .info-item {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }

        input[type="range"] {
            width: 100%;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 20px;
        }

        .loading.hidden {
            display: none;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        canvas {
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="renderCanvas"></canvas>

        <div class="overlay">
            <h1>🐕 3D AR Dog Viewer</h1>
            <p>Interactive augmented reality experience with your extracted dog</p>
        </div>

        <div class="controls-panel">
            <button id="playBtn">▶️ Play</button>
            <button id="resetBtn">🔄 Reset View</button>
            <button id="environmentBtn">🌍 Change Environment</button>
        </div>

        <div class="info-panel">
            <h3>⚙️ AR Controls</h3>
            <div class="info-item">
                <strong>Drag:</strong>
                <span>Rotate view</span>
            </div>
            <div class="info-item">
                <strong>Scroll:</strong>
                <span>Zoom in/out</span>
            </div>
            <div class="info-item">
                <strong>Right drag:</strong>
                <span>Pan camera</span>
            </div>
            <hr style="margin: 15px 0; border-color: rgba(255,255,255,0.2);">
            <div class="slider-container">
                <label>Video Size:</label>
                <input type="range" id="scaleSlider" min="0.5" max="3" step="0.1" value="1.5">
            </div>
            <div class="slider-container" style="margin-top: 15px;">
                <label>Height:</label>
                <input type="range" id="heightSlider" min="-2" max="2" step="0.1" value="0">
            </div>
            <div class="slider-container" style="margin-top: 15px;">
                <label>Rotation Speed:</label>
                <input type="range" id="rotationSlider" min="0" max="2" step="0.1" value="0">
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <h2>Loading AR Environment...</h2>
            <p>Setting up 3D scene and video texture</p>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Three.js AR Scene
        let scene, camera, renderer, controls;
        let videoPlane, videoTexture;
        let video;
        let rotationSpeed = 0;
        let currentEnvironment = 0;
        const environments = ['gradient', 'grid', 'particles'];

        // Initialize scene
        function init() {
            // Scene
            scene = new THREE.Scene();
            updateEnvironment();

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 3;

            // Renderer
            renderer = new THREE.WebGLRenderer({
                canvas: document.getElementById('renderCanvas'),
                alpha: true,
                antialias: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 1;
            controls.maxDistance = 10;

            // Create video element
            video = document.createElement('video');
            video.src = '🤐 2025-11-11 22.20.34.mp4';
            video.loop = true;
            video.muted = true;
            video.crossOrigin = 'anonymous';

            // Video texture
            videoTexture = new THREE.VideoTexture(video);
            videoTexture.minFilter = THREE.LinearFilter;
            videoTexture.magFilter = THREE.LinearFilter;

            // Create plane with video
            const geometry = new THREE.PlaneGeometry(2, 1.5);
            const material = new THREE.MeshBasicMaterial({
                map: videoTexture,
                side: THREE.DoubleSide,
                transparent: true
            });
            videoPlane = new THREE.Mesh(geometry, material);
            scene.add(videoPlane);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 0.8);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);

            // Add particle system for effect
            addParticles();

            // Event listeners
            setupEventListeners();

            // Hide loading
            document.getElementById('loading').classList.add('hidden');

            // Start animation
            animate();
        }

        function addParticles() {
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 500;
            const posArray = new Float32Array(particlesCount * 3);

            for (let i = 0; i < particlesCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 10;
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.02,
                color: 0x667eea,
                transparent: true,
                opacity: 0.6
            });

            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            particlesMesh.name = 'particles';
            scene.add(particlesMesh);
        }

        function updateEnvironment() {
            const env = environments[currentEnvironment];

            switch(env) {
                case 'gradient':
                    scene.background = new THREE.Color(0x1a1a2e);
                    scene.fog = new THREE.Fog(0x1a1a2e, 5, 15);
                    break;
                case 'grid':
                    scene.background = new THREE.Color(0x0f0f1e);
                    addGridHelper();
                    break;
                case 'particles':
                    scene.background = new THREE.Color(0x000814);
                    break;
            }
        }

        function addGridHelper() {
            const oldGrid = scene.getObjectByName('grid');
            if (oldGrid) scene.remove(oldGrid);

            const gridHelper = new THREE.GridHelper(10, 10, 0x667eea, 0x444444);
            gridHelper.position.y = -1.5;
            gridHelper.name = 'grid';
            scene.add(gridHelper);
        }

        function setupEventListeners() {
            // Play button
            document.getElementById('playBtn').addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                    document.getElementById('playBtn').textContent = '⏸️ Pause';
                } else {
                    video.pause();
                    document.getElementById('playBtn').textContent = '▶️ Play';
                }
            });

            // Reset button
            document.getElementById('resetBtn').addEventListener('click', () => {
                camera.position.set(0, 0, 3);
                controls.reset();
                videoPlane.rotation.set(0, 0, 0);
                videoPlane.position.set(0, 0, 0);
            });

            // Environment button
            document.getElementById('environmentBtn').addEventListener('click', () => {
                currentEnvironment = (currentEnvironment + 1) % environments.length;
                updateEnvironment();
            });

            // Scale slider
            document.getElementById('scaleSlider').addEventListener('input', (e) => {
                const scale = parseFloat(e.target.value);
                videoPlane.scale.set(scale, scale, 1);
            });

            // Height slider
            document.getElementById('heightSlider').addEventListener('input', (e) => {
                videoPlane.position.y = parseFloat(e.target.value);
            });

            // Rotation slider
            document.getElementById('rotationSlider').addEventListener('input', (e) => {
                rotationSpeed = parseFloat(e.target.value);
            });

            // Window resize
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Auto-rotation
            if (rotationSpeed > 0) {
                videoPlane.rotation.y += rotationSpeed * 0.01;
            }

            // Animate particles
            const particles = scene.getObjectByName('particles');
            if (particles) {
                particles.rotation.y += 0.001;
                particles.rotation.x += 0.0005;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Start
        init();
    </script>
</body>
</html>
