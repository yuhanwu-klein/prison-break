<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Dog Extractor - Background Removal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .video-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .video-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 15px;
            position: relative;
        }

        .video-panel h3 {
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        video, canvas {
            width: 100%;
            border-radius: 10px;
            background: #000;
            display: block;
        }

        #outputCanvas {
            background: repeating-conic-gradient(#808080 0% 25%, #ffffff 0% 50%) 50% / 20px 20px;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: rgba(255,255,255,0.5);
        }

        .status {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            font-size: 1.1em;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .settings {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .setting-row:last-child {
            margin-bottom: 0;
        }

        .setting-row label {
            font-size: 1em;
        }

        input[type="range"] {
            width: 200px;
            margin: 0 10px;
        }

        .value-display {
            min-width: 50px;
            text-align: right;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .video-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐕 AR Dog Extractor</h1>
            <p class="subtitle">Extract dog motion and remove background using AI</p>
        </header>

        <div class="video-container">
            <div class="video-grid">
                <div class="video-panel">
                    <h3>📹 Original Video</h3>
                    <video id="inputVideo" controls muted loop></video>
                </div>
                <div class="video-panel">
                    <h3>✨ Extracted Dog (No Background)</h3>
                    <canvas id="outputCanvas"></canvas>
                </div>
            </div>

            <div class="settings">
                <h3 style="margin-bottom: 15px;">⚙️ Settings</h3>
                <div class="setting-row">
                    <label for="segmentationScore">Segmentation Precision:</label>
                    <input type="range" id="segmentationScore" min="0" max="100" value="50" step="1">
                    <span class="value-display" id="segmentationScoreValue">0.50</span>
                </div>
                <div class="setting-row">
                    <label for="blurAmount">Edge Smoothing:</label>
                    <input type="range" id="blurAmount" min="0" max="20" value="5" step="1">
                    <span class="value-display" id="blurAmountValue">5px</span>
                </div>
            </div>

            <div class="controls">
                <button id="loadBtn" class="primary">📂 Load Video</button>
                <button id="processBtn" disabled>🎬 Start Processing</button>
                <button id="pauseBtn" disabled>⏸️ Pause</button>
                <button id="downloadBtn" disabled>💾 Download Result</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading AI model... This may take a moment.</p>
            </div>

            <div class="status" id="status">
                Ready! Click "Load Video" to begin.
            </div>
        </div>
    </div>

    <!-- TensorFlow.js and BodyPix -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0"></script>
    <script src="ar-processor.js"></script>
</body>
</html>
